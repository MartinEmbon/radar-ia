# Fuentes del Radar IA.
# Si una fuente falla (URL cambió, timeout), el recolector la saltea y sigue.
# `filter: true` aplica el filtro de palabras clave (útil para feeds generales).
# `max`: cuántas entradas tomar como máximo de esa fuente.

lookback_hours: 48        # ventana de tiempo; el estado en state/seen.json evita repetidos
max_items_total: 110      # tope de items que se le pasan a Claude

keywords:
  - ai
  - llm
  - llms
  - agent
  - agents
  - agentic
  - mcp
  - claude
  - anthropic
  - openai
  - gpt
  - gemini
  - copilot
  - cursor
  - codex
  - openclaw
  - obsidian
  - rag
  - embedding
  - embeddings
  - inference
  - fine-tuning
  - deepseek
  - qwen
  - llama
  - mistral
  - hugging face
  - ipaas
  - workflow automation
  - n8n
  - healthtech
  - health ai
  - clinical ai
  - ambient scribe
  - ai scribe
  - medical ai
  - ehr
  - machine learning

rss:
  # Labs y empresas
  - name: OpenAI
    url: https://openai.com/news/rss.xml
    max: 4
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    max: 3
  - name: Google AI (Keyword)
    url: https://blog.google/technology/ai/rss/
    max: 3
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    max: 3
  - name: GitHub Changelog
    url: https://github.blog/changelog/feed/
    max: 15
    filter: true
  # Newsletters y analistas
  # Equipos, prácticas y cambio de mentalidad con IA
  - name: Martin Fowler
    url: https://martinfowler.com/feed.atom
    max: 5
  - name: The Pragmatic Engineer
    url: https://newsletter.pragmaticengineer.com/feed
    max: 3
  - name: One Useful Thing (Ethan Mollick)
    url: https://www.oneusefulthing.org/feed
    max: 3
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
    max: 12
  - name: Latent Space
    url: https://www.latent.space/feed
    max: 5
  - name: Interconnects
    url: https://www.interconnects.ai/feed
    max: 3
  - name: TLDR AI
    url: https://tldr.tech/api/rss/ai
    max: 5
  # Salud: alimenta el radar de NexoSalud (filtrado por IA)
  - name: Fierce Healthcare
    url: https://www.fiercehealthcare.com/rss/xml
    max: 20
    filter: true
  - name: STAT Health Tech
    url: https://www.statnews.com/category/health-tech/feed/
    max: 10
    filter: true

# Anthropic no publica RSS: el prompt le pide a Claude revisar anthropic.com/news directamente.
check_pages:
  - https://www.anthropic.com/news
  - https://www.claude.com/blog

# Blogs que bloquean la descarga del RSS desde GitHub: los revisa Claude directamente.
check_pages_equipos:
  - https://martinfowler.com/tags/generative%20AI.html
  - https://addyo.substack.com/archive
  - https://tidyfirst.substack.com/archive

check_pages_nexosalud:
  - https://www.mobihealthnews.com/
  - https://www.healthcareitnews.com/

hacker_news:
  enabled: true
  min_points: 80
  max: 15

github:
  enabled: true
  min_stars: 40
  max_per_query: 3
  created_within_days: 10
  queries:
    - topic:llm
    - topic:ai-agents
    - topic:mcp
    - topic:claude-code
    - topic:agents
